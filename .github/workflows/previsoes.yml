name: Atualizar previsões

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: previsoes
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar previsões
        working-directory: previsoes
        env:
          SPORTMONKS_API_TOKEN: ${{ secrets.SPORTMONKS_API_TOKEN }}
        run: node scripts/gerar.js

      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add previsoes/data
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "Atualiza previsões"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
